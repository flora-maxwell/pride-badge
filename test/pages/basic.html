<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>basic</title>
<script src="/dist/pride-badge.js" defer></script>
<style>body { font: 16px/1.4 system-ui, sans-serif; padding: 40px; } .row { margin: 24px 0; }</style></head>
<body>
  <div class="row"><pride-badge id="plain"></pride-badge></div>
  <div class="row"><pride-badge id="safe" texts="safe-with-me love-is-love"></pride-badge></div>
  <div class="row"><pride-badge id="nonsense" texts="nonsense"></pride-badge></div>
  <div class="row"><pride-badge id="de" lang="de"></pride-badge></div>
  <div class="row"><pride-badge id="dark" style="--pride-badge-bg: #18181b; --pride-badge-color: #fafafa"></pride-badge></div>
  <div class="row"><pride-badge id="noshadow" shadow="off"></pride-badge></div>
  <div class="row"><pride-badge id="ownfocus" style="--pride-badge-focus-ring: 3px dashed rgb(109, 40, 217); --pride-badge-focus-offset: 6px; --pride-badge-focus-glow: 0 0 transparent"></pride-badge></div>
  <div class="row" style="font-size: 32px"><pride-badge id="big"></pride-badge></div>
</body>
</html>
